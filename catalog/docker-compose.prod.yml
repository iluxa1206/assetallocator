# Production stack for assetallocator.ru — VPS with Caddy reverse proxy + Let's Encrypt TLS.
# Isolated from the dev stack via `name:` below (separate volumes/network).
# Usage:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
# First deploy — run migrations + seed (scripts run as modules, -m):
#   docker compose -f docker-compose.prod.yml exec backend uv run alembic upgrade head
#   docker compose -f docker-compose.prod.yml exec backend uv run python -m scripts.seed_admin
#   docker compose -f docker-compose.prod.yml exec backend uv run python -m scripts.seed_catalog
#   docker compose -f docker-compose.prod.yml exec backend uv run python -m scripts.seed_strategies

name: astra-prod

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: astra
      POSTGRES_USER: astra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astra"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 200

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://astra:${POSTGRES_PASSWORD:?}@postgres:5432/astra
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env.prod}
      COOKIE_SECURE: "true"
      APP_URL: https://assetallocator.ru
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_TLS: "false"
    volumes:
      - ./seed_data:/seed_data:ro
      - attachments:/app/data/attachments
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_INTERNAL_URL: http://backend:8000
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  attachments:
